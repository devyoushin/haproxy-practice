global
    log /dev/log local0
    maxconn 8192
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend public_http
    bind *:80
    default_backend public_app

backend public_app
    balance roundrobin
    option httpchk GET /health
    server app1 10.0.20.10:8080 check
    server app2 10.0.20.11:8080 check
