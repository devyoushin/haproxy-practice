global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend http
    bind *:80
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /health
    server app1 10.0.10.10:8080 check
